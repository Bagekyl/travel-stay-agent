    - data:
        code: "from datetime import datetime, timedelta\n\n\ndef main(\n    current_date,\n\
          \    forecast_last_date,\n\n    new_destination_city=None,\n    new_trip_date_text=None,\n\
          \    new_trip_start_date=None,\n    new_trip_end_date=None,\n    new_duration_days=None,\n\
          \    new_nights=None,\n    new_traveler_count=None,\n    new_budget_max_per_night=None,\n\
          \    new_budget_total=None,\n    new_preferences=None,\n    new_trip_style=None,\n\
          \n    old_destination_city=None,\n    old_trip_date_text=None,\n    old_trip_start_date=None,\n\
          \    old_trip_end_date=None,\n    old_duration_days=None,\n    old_nights=None,\n\
          \    old_traveler_count=None,\n    old_budget_max_per_night=None,\n    old_budget_total=None,\n\
          \    old_preferences=None,\n    old_trip_style=None,\n    old_budget_basis=None,\n\
          ):\n    \"\"\"Merge current-turn parameters with conversation state and\
          \ normalize them.\"\"\"\n\n    def has_value(value):\n        if value is\
          \ None:\n            return False\n        if isinstance(value, str):\n\
          \            return bool(value.strip())\n        if isinstance(value, list):\n\
          \            return len(value) > 0\n        return True\n\n    def choose(new_value,\
          \ old_value, default=None):\n        return new_value if has_value(new_value)\
          \ else (\n            old_value if has_value(old_value) else default\n \
          \       )\n\n    def parse_date(value):\n        if not has_value(value):\n\
          \            return None\n        try:\n            return datetime.strptime(str(value),\
          \ \"%Y-%m-%d\").date()\n        except ValueError:\n            return None\n\
          \n    def clean_number(value):\n        if value is None or value == \"\"\
          :\n            return 0\n        try:\n            return float(value)\n\
          \        except (TypeError, ValueError):\n            return 0\n\n    #\
          \ --------------------------------------------------\n    # 1. Merge current\
          \ turn and old conversation state\n    # --------------------------------------------------\n\
          \n    destination_city = choose(\n        new_destination_city,\n      \
          \  old_destination_city,\n        \"\"\n    )\n\n    trip_date_text = choose(\n\
          \        new_trip_date_text,\n        old_trip_date_text,\n        \"\"\n\
          \    )\n\n    trip_start_date = choose(\n        new_trip_start_date,\n\
          \        old_trip_start_date,\n        \"\"\n    )\n\n    trip_end_date\
          \ = choose(\n        new_trip_end_date,\n        old_trip_end_date,\n  \
          \      \"\"\n    )\n\n    duration_days = clean_number(\n        choose(new_duration_days,\
          \ old_duration_days, 0)\n    )\n\n    nights = clean_number(\n        choose(new_nights,\
          \ old_nights, 0)\n    )\n\n    traveler_count = clean_number(\n        choose(new_traveler_count,\
          \ old_traveler_count, 0)\n    )\n\n    preferences = choose(\n        new_preferences,\n\
          \        old_preferences,\n        []\n    )\n\n    trip_style = choose(\n\
          \        new_trip_style,\n        old_trip_style,\n        \"\"\n    )\n\
          \n    # --------------------------------------------------\n    # 2. Normalize\
          \ date relationships\n    # --------------------------------------------------\n\
          \n    start = parse_date(trip_start_date)\n    end = parse_date(trip_end_date)\n\
          \n    if start and end and end >= start:\n        duration_days = (end -\
          \ start).days + 1\n        nights = (end - start).days\n\n    elif start\
          \ and nights > 0:\n        end = start + timedelta(days=int(nights))\n \
          \       trip_end_date = end.isoformat()\n        duration_days = int(nights)\
          \ + 1\n\n    elif start and duration_days > 0:\n        end = start + timedelta(days=int(duration_days)\
          \ - 1)\n        trip_end_date = end.isoformat()\n        nights = max(int(duration_days)\
          \ - 1, 0)\n\n    # --------------------------------------------------\n\
          \    # 3. Normalize budget basis\n    # --------------------------------------------------\n\
          \n    budget_basis = choose(\n        None,\n        old_budget_basis,\n\
          \        \"unknown\"\n    )\n\n    budget_max_per_night = clean_number(\n\
          \        old_budget_max_per_night\n    )\n\n    budget_total = clean_number(\n\
          \        old_budget_total\n    )\n\n    # Current-turn per-night budget\
          \ has highest priority.\n    if clean_number(new_budget_max_per_night) >\
          \ 0:\n        budget_max_per_night = clean_number(\n            new_budget_max_per_night\n\
          \        )\n        budget_basis = \"per_night\"\n\n        if nights >\
          \ 0:\n            budget_total = budget_max_per_night * nights\n\n    #\
          \ Otherwise, current-turn total budget takes priority.\n    elif clean_number(new_budget_total)\
          \ > 0:\n        budget_total = clean_number(new_budget_total)\n        budget_basis\
          \ = \"total\"\n\n        if nights > 0:\n            budget_max_per_night\
          \ = round(\n                budget_total / nights,\n                2\n\
          \            )\n\n    # Recalculate derived value if trip length changed.\n\
          \    elif budget_basis == \"total\" and budget_total > 0 and nights > 0:\n\
          \        budget_max_per_night = round(\n            budget_total / nights,\n\
          \            2\n        )\n\n    elif (\n        budget_basis == \"per_night\"\
          \n        and budget_max_per_night > 0\n        and nights > 0\n    ):\n\
          \        budget_total = budget_max_per_night * nights\n\n    # --------------------------------------------------\n\
          \    # 4. City support state\n    # --------------------------------------------------\n\
          \n    if not destination_city:\n        city_supported = False\n       \
          \ city_status = \"missing\"\n    elif destination_city.strip() == \"海口\"\
          :\n        city_supported = True\n        city_status = \"supported\"\n\
          \    else:\n        city_supported = False\n        city_status = \"unsupported\"\
          \n\n    # --------------------------------------------------\n    # 5. Date\
          \ validation\n    # --------------------------------------------------\n\
          \n    today = parse_date(current_date)\n    forecast_last = parse_date(forecast_last_date)\n\
          \n    if not trip_start_date:\n        date_status = \"missing\"\n\n   \
          \ elif not start:\n        date_status = \"invalid\"\n\n    elif start <\
          \ today:\n        date_status = \"past\"\n\n    elif trip_end_date and not\
          \ end:\n        date_status = \"invalid\"\n\n    elif end and end < start:\n\
          \        date_status = \"invalid\"\n\n    else:\n        date_status = \"\
          valid\"\n\n    # --------------------------------------------------\n  \
          \  # 6. Weather coverage mode\n    # --------------------------------------------------\n\
          \n    weather_mode = \"not_ready\"\n\n    if date_status == \"valid\" and\
          \ start:\n        effective_end = end if end else start\n\n        if effective_end\
          \ <= forecast_last:\n            weather_mode = \"full\"\n\n        elif\
          \ start <= forecast_last < effective_end:\n            weather_mode = \"\
          partial\"\n\n        elif start > forecast_last:\n            weather_mode\
          \ = \"unavailable\"\n\n    # --------------------------------------------------\n\
          \    # 7. Missing field detection\n    # --------------------------------------------------\n\
          \n    missing_fields = []\n\n    if not destination_city:\n        missing_fields.append(\"\
          destination_city\")\n\n    if not trip_start_date:\n        missing_fields.append(\"\
          trip_start_date\")\n\n    if not trip_end_date and duration_days <= 0 and\
          \ nights <= 0:\n        missing_fields.append(\"trip_duration\")\n\n   \
          \ if traveler_count <= 0:\n        missing_fields.append(\"traveler_count\"\
          )\n\n    if budget_max_per_night <= 0 and budget_total <= 0:\n        missing_fields.append(\"\
          budget\")\n\n    if not preferences and not trip_style:\n        missing_fields.append(\"\
          preferences_or_trip_style\")\n\n    info_complete = (\n        len(missing_fields)\
          \ == 0\n        and date_status == \"valid\"\n        and city_supported\n\
          \    )\n\n    return {\n        \"destination_city\": destination_city,\n\
          \        \"trip_date_text\": trip_date_text,\n        \"trip_start_date\"\
          : trip_start_date,\n        \"trip_end_date\": trip_end_date,\n\n      \
          \  \"duration_days\": int(duration_days),\n        \"nights\": int(nights),\n\
          \        \"traveler_count\": int(traveler_count),\n\n        \"budget_max_per_night\"\
          : float(budget_max_per_night),\n        \"budget_total\": float(budget_total),\n\
          \        \"budget_basis\": budget_basis,\n\n        \"preferences\": preferences,\n\
          \        \"trip_style\": trip_style,\n\n        \"city_supported\": city_supported,\n\
          \        \"city_status\": city_status,\n\n        \"date_status\": date_status,\n\
          \        \"weather_mode\": weather_mode,\n\n        \"missing_fields\":\
          \ missing_fields,\n        \"info_complete\": info_complete,\n    }"
        code_language: python3
