    - data:
        code: "import json\nfrom datetime import datetime\n\n\ndef main(\n    weather_body:\
          \ str,\n    trip_start_date: str,\n    trip_end_date: str,\n    weather_mode:\
          \ str,\n) -> dict:\n    \"\"\"\n    Extract weather data overlapping with\
          \ the user's trip dates\n    and generate a compact weather context.\n \
          \   \"\"\"\n\n    try:\n        data = json.loads(weather_body)\n    except\
          \ Exception as exc:\n        return {\n            \"weather_context\":\
          \ (\n                \"天气数据解析失败，后续不得生成具体天气结论。\"\n            ),\n      \
          \      \"weather_days_json\": \"[]\",\n            \"weather_covered_until\"\
          : \"\",\n            \"weather_data_valid\": False,\n            \"weather_risk_level\"\
          : \"unknown\",\n            \"weather_risk_summary\": \"天气数据解析失败\",\n  \
          \      }\n\n    daily = data.get(\"daily\", {})\n\n    dates = daily.get(\"\
          time\", [])\n    weather_codes = daily.get(\"weather_code\", [])\n    temp_max\
          \ = daily.get(\"temperature_2m_max\", [])\n    temp_min = daily.get(\"temperature_2m_min\"\
          , [])\n    rain_prob = daily.get(\"precipitation_probability_max\", [])\n\
          \    precipitation = daily.get(\"precipitation_sum\", [])\n    wind_max\
          \ = daily.get(\"wind_speed_10m_max\", [])\n\n    required_lengths = [\n\
          \        len(dates),\n        len(weather_codes),\n        len(temp_max),\n\
          \        len(temp_min),\n        len(rain_prob),\n        len(precipitation),\n\
          \        len(wind_max),\n    ]\n\n    if not dates or len(set(required_lengths))\
          \ != 1:\n        return {\n            \"weather_context\": (\n        \
          \        \"天气数据字段缺失或长度不一致，\"\n                \"后续不得生成具体天气结论。\"\n      \
          \      ),\n            \"weather_days_json\": \"[]\",\n            \"weather_covered_until\"\
          : \"\",\n            \"weather_data_valid\": False,\n            \"weather_risk_level\"\
          : \"unknown\",\n            \"weather_risk_summary\": \"天气数据不完整\",\n   \
          \     }\n\n    try:\n        trip_start = datetime.strptime(\n         \
          \   trip_start_date,\n            \"%Y-%m-%d\"\n        ).date()\n\n   \
          \     trip_end = datetime.strptime(\n            trip_end_date,\n      \
          \      \"%Y-%m-%d\"\n        ).date()\n\n    except ValueError:\n      \
          \  return {\n            \"weather_context\": (\n                \"旅行日期格式无效，无法匹配具体天气数据。\"\
          \n            ),\n            \"weather_days_json\": \"[]\",\n         \
          \   \"weather_covered_until\": \"\",\n            \"weather_data_valid\"\
          : False,\n            \"weather_risk_level\": \"unknown\",\n           \
          \ \"weather_risk_summary\": \"旅行日期格式无效\",\n        }\n\n    selected_days\
          \ = []\n\n    for i, date_str in enumerate(dates):\n        current_date\
          \ = datetime.strptime(\n            date_str,\n            \"%Y-%m-%d\"\n\
          \        ).date()\n\n        if trip_start <= current_date <= trip_end:\n\
          \            selected_days.append({\n                \"date\": date_str,\n\
          \                \"weather_code\": weather_codes[i],\n                \"\
          temperature_max_c\": temp_max[i],\n                \"temperature_min_c\"\
          : temp_min[i],\n                \"precipitation_probability_max_pct\": rain_prob[i],\n\
          \                \"precipitation_sum_mm\": precipitation[i],\n         \
          \       \"wind_speed_max_kmh\": wind_max[i],\n            })\n\n    if not\
          \ selected_days:\n        return {\n            \"weather_context\": (\n\
          \                \"没有找到与旅行日期重合的具体天气数据，\"\n                \"后续不得生成具体天气结论。\"\
          \n            ),\n            \"weather_days_json\": \"[]\",\n         \
          \   \"weather_covered_until\": dates[-1],\n            \"weather_data_valid\"\
          : False,\n            \"weather_risk_level\": \"unknown\",\n           \
          \ \"weather_risk_summary\": \"无旅行日期对应天气数据\",\n        }\n\n    # -----------------------------\n\
          \    # Risk analysis\n    # -----------------------------\n\n    max_temp\
          \ = max(\n        day[\"temperature_max_c\"]\n        for day in selected_days\n\
          \    )\n\n    max_rain_prob = max(\n        day[\"precipitation_probability_max_pct\"\
          ]\n        for day in selected_days\n    )\n\n    total_precipitation =\
          \ sum(\n        day[\"precipitation_sum_mm\"]\n        for day in selected_days\n\
          \    )\n\n    max_wind = max(\n        day[\"wind_speed_max_kmh\"]\n   \
          \     for day in selected_days\n    )\n\n    risk_notes = []\n\n    if max_temp\
          \ >= 33:\n        risk_notes.append(\n            \"存在高温天气，建议减少中午至下午时段的户外活动。\"\
          \n        )\n\n    if max_rain_prob >= 60:\n        risk_notes.append(\n\
          \            \"存在较高降雨概率，应准备室内备选地点。\"\n        )\n\n    if total_precipitation\
          \ > 0:\n        risk_notes.append(\n            \"旅行期间存在降水，应携带雨具并关注户外活动安排。\"\
          \n        )\n\n    if max_wind >= 30:\n        risk_notes.append(\n    \
          \        \"存在较明显大风，应谨慎安排海滨和开放区域活动。\"\n        )\n\n    if not risk_notes:\n\
          \        risk_notes.append(\n            \"当前预报未显示明显高温、强降雨或大风风险。\"\n   \
          \     )\n\n    if (\n        max_rain_prob >= 80\n        or max_wind >=\
          \ 40\n        or max_temp >= 36\n    ):\n        weather_risk_level = \"\
          high\"\n\n    elif (\n        max_rain_prob >= 60\n        or max_wind >=\
          \ 30\n        or max_temp >= 33\n    ):\n        weather_risk_level = \"\
          medium\"\n\n    else:\n        weather_risk_level = \"low\"\n\n    # -----------------------------\n\
          \    # Build compact context\n    # -----------------------------\n\n  \
          \  lines = [\n        f\"天气覆盖模式：{weather_mode}\",\n        f\"具体天气覆盖至：{dates[-1]}\"\
          ,\n        \"\",\n        \"旅行日期天气：\",\n    ]\n\n    for day in selected_days:\n\
          \        lines.append(\n            (\n                f\"{day['date']}：\"\
          \n                f\"最高 {day['temperature_max_c']}°C，\"\n              \
          \  f\"最低 {day['temperature_min_c']}°C，\"\n                f\"最大降雨概率 \"\n\
          \                f\"{day['precipitation_probability_max_pct']}%，\"\n   \
          \             f\"降水量 {day['precipitation_sum_mm']} mm，\"\n             \
          \   f\"最大风速 {day['wind_speed_max_kmh']} km/h。\"\n            )\n       \
          \ )\n\n    lines.extend([\n        \"\",\n        f\"天气风险等级：{weather_risk_level}\"\
          ,\n        \"天气风险提示：\",\n        *[f\"- {note}\" for note in risk_notes],\n\
          \    ])\n\n    if weather_mode == \"partial\":\n        lines.extend([\n\
          \            \"\",\n            \"注意：本次旅行只有部分日期处于具体天气预报范围内。\",\n       \
          \     \"超出预报范围的日期不得生成具体天气结论。\",\n        ])\n\n    return {\n        \"\
          weather_context\": \"\\n\".join(lines),\n        \"weather_days_json\":\
          \ json.dumps(\n            selected_days,\n            ensure_ascii=False\n\
          \        ),\n        \"weather_covered_until\": dates[-1],\n        \"weather_data_valid\"\
          : True,\n        \"weather_risk_level\": weather_risk_level,\n        \"\
