    - data:
        code: "import json\n\n\ndef main(\n    route_origins_json: str,\n    selected_places_json:\
          \ str,\n) -> dict:\n    \"\"\"\n    Build a Google Routes Compute Route\
          \ Matrix request body.\n\n    Preferred waypoint identity:\n    1. Google\
          \ Place ID\n    2. Latitude / longitude fallback\n\n    Also preserve origin\
          \ and destination index mappings,\n    because Route Matrix responses are\
          \ identified by indices.\n    \"\"\"\n\n    def empty_result(summary: str)\
          \ -> dict:\n        return {\n            \"route_matrix_body\": \"{}\"\
          ,\n            \"origin_index_map_json\": \"[]\",\n            \"destination_index_map_json\"\
          : \"[]\",\n            \"origin_count\": 0,\n            \"destination_count\"\
          : 0,\n            \"matrix_element_count\": 0,\n            \"route_matrix_ready\"\
          : False,\n            \"route_request_summary\": summary,\n        }\n\n\
          \    def parse_json_list(value):\n        try:\n            data = json.loads(value)\n\
          \        except Exception:\n            return []\n\n        return data\
          \ if isinstance(data, list) else []\n\n    def build_waypoint(item):\n \
          \       \"\"\"\n        Prefer placeId.\n        Fall back to latLng.\n\
          \        \"\"\"\n\n        place_id = item.get(\"google_place_id\")\n\n\
          \        if isinstance(place_id, str) and place_id.strip():\n          \
          \  return {\n                \"waypoint\": {\n                    \"placeId\"\
          : place_id.strip()\n                }\n            }\n\n        location\
          \ = item.get(\"location\", {})\n\n        if not isinstance(location, dict):\n\
          \            return None\n\n        latitude = location.get(\"latitude\"\
          )\n        longitude = location.get(\"longitude\")\n\n        if (\n   \
          \         isinstance(latitude, (int, float))\n            and isinstance(longitude,\
          \ (int, float))\n        ):\n            return {\n                \"waypoint\"\
          : {\n                    \"location\": {\n                        \"latLng\"\
          : {\n                            \"latitude\": latitude,\n             \
          \               \"longitude\": longitude,\n                        }\n \
          \                   }\n                }\n            }\n\n        return\
          \ None\n\n    route_origins = parse_json_list(\n        route_origins_json\n\
          \    )\n\n    selected_places = parse_json_list(\n        selected_places_json\n\
          \    )\n\n    if not route_origins:\n        return empty_result(\n    \
          \        \"没有可用于 Routes 计算的候选酒店起点。\"\n        )\n\n    if not selected_places:\n\
          \        return empty_result(\n            \"没有可用于 Routes 计算的目标地点终点。\"\n\
          \        )\n\n    origins = []\n    destinations = []\n\n    origin_index_map\
          \ = []\n    destination_index_map = []\n\n    # -----------------------------\n\
          \    # Origins: hotels\n    # -----------------------------\n\n    for hotel\
          \ in route_origins:\n        if not isinstance(hotel, dict):\n         \
          \   continue\n\n        waypoint = build_waypoint(hotel)\n\n        if waypoint\
          \ is None:\n            continue\n\n        origin_index = len(origins)\n\
          \n        origins.append(waypoint)\n\n        origin_index_map.append({\n\
          \            \"origin_index\": origin_index,\n            \"hotel_id\":\
          \ hotel.get(\"hotel_id\"),\n            \"hotel_name\": hotel.get(\"name\"\
          ),\n            \"google_place_id\": hotel.get(\n                \"google_place_id\"\
          \n            ),\n        })\n\n    # -----------------------------\n  \
          \  # Destinations: selected places\n    # -----------------------------\n\
          \n    for place in selected_places:\n        if not isinstance(place, dict):\n\
          \            continue\n\n        waypoint = build_waypoint(place)\n\n  \
          \      if waypoint is None:\n            continue\n\n        destination_index\
          \ = len(destinations)\n\n        destinations.append(waypoint)\n\n     \
          \   destination_index_map.append({\n            \"destination_index\": destination_index,\n\
          \            \"place_id\": place.get(\"place_id\"),\n            \"place_name\"\
          : place.get(\"name\"),\n            \"category\": place.get(\"category\"\
          ),\n            \"area\": place.get(\"area\"),\n            \"route_priority\"\
          : place.get(\n                \"route_priority\"\n            ),\n     \
          \   })\n\n    origin_count = len(origins)\n    destination_count = len(destinations)\n\
          \n    matrix_element_count = (\n        origin_count * destination_count\n\
          \    )\n\n    route_matrix_ready = (\n        origin_count > 0\n       \
          \ and destination_count > 0\n        and matrix_element_count > 0\n    )\n\
          \n    if not route_matrix_ready:\n        return empty_result(\n       \
          \     \"Routes 请求起点或终点构造失败。\"\n        )\n\n    request_body = {\n     \
          \   \"origins\": origins,\n        \"destinations\": destinations,\n   \
          \     \"travelMode\": \"DRIVE\",\n        \"routingPreference\": \"TRAFFIC_AWARE\"\
          ,\n    }\n\n    summary = (\n        f\"已构造 {origin_count} 个酒店起点和 \"\n \
          \       f\"{destination_count} 个目标地点终点，\"\n        f\"共 {matrix_element_count}\
          \ 个路线矩阵元素。\"\n    )\n\n    return {\n        \"route_matrix_body\": json.dumps(\n\
          \            request_body,\n            ensure_ascii=False\n        ),\n\
          \        \"origin_index_map_json\": json.dumps(\n            origin_index_map,\n\
          \            ensure_ascii=False\n        ),\n        \"destination_index_map_json\"\
          : json.dumps(\n            destination_index_map,\n            ensure_ascii=False\n\
          \        ),\n        \"origin_count\": origin_count,\n        \"destination_count\"\
          : destination_count,\n        \"matrix_element_count\": matrix_element_count,\n\
          \        \"route_matrix_ready\": route_matrix_ready,\n        \"route_request_summary\"\
          : summary,\n    }"
        code_language: python3
        desc: 将候选酒店起点和已选目标地点终点转换为 Google Routes API Compute Route Matrix 所需的标准请求结构，并生成起点、终点索引映射及矩阵规模信息，为后续路线矩阵请求和结果解析提供可靠输入。
