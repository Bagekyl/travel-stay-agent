    - data:
        code: "import json\n\n\ndef main(selected_place_ids: list, places_body: str)\
          \ -> dict:\n    \"\"\"\n    Extract the full place objects selected by the\
          \ LLM\n    from the Places Mock API response.\n    \"\"\"\n\n    try:\n\
          \        payload = json.loads(places_body)\n    except Exception:\n    \
          \    return {\n            \"selected_places_json\": \"[]\",\n         \
          \   \"selected_place_names\": [],\n            \"selected_place_areas\"\
          : [],\n            \"preferred_hotel_areas\": [],\n            \"missing_place_ids\"\
          : selected_place_ids or [],\n            \"selected_place_count\": 0,\n\
          \            \"extraction_valid\": False,\n        }\n\n    data = payload.get(\"\
          data\", [])\n\n    if not isinstance(data, list):\n        return {\n  \
          \          \"selected_places_json\": \"[]\",\n            \"selected_place_names\"\
          : [],\n            \"selected_place_areas\": [],\n            \"preferred_hotel_areas\"\
          : [],\n            \"missing_place_ids\": selected_place_ids or [],\n  \
          \          \"selected_place_count\": 0,\n            \"extraction_valid\"\
          : False,\n        }\n\n    place_map = {\n        item.get(\"place_id\"\
          ): item\n        for item in data\n        if isinstance(item, dict) and\
          \ item.get(\"place_id\")\n    }\n\n    selected_places = []\n    missing_place_ids\
          \ = []\n\n    # Preserve the LLM-selected order\n    for place_id in selected_place_ids\
          \ or []:\n        place = place_map.get(place_id)\n\n        if place is\
          \ not None:\n            selected_places.append(place)\n        else:\n\
          \            missing_place_ids.append(place_id)\n\n    selected_place_names\
          \ = [\n        place.get(\"name\", \"\")\n        for place in selected_places\n\
          \        if place.get(\"name\")\n    ]\n\n    selected_place_areas = []\n\
          \n    for place in selected_places:\n        area = place.get(\"area\")\n\
          \n        if area and area not in selected_place_areas:\n            selected_place_areas.append(area)\n\
          \n    preferred_hotel_areas = []\n\n    for place in selected_places:\n\
          \        areas = place.get(\"preferred_hotel_areas\", [])\n\n        if\
          \ isinstance(areas, list):\n            for area in areas:\n           \
          \     if area and area not in preferred_hotel_areas:\n                 \
          \   preferred_hotel_areas.append(area)\n\n    extraction_valid = (\n   \
          \     len(selected_places) >= 2\n        and len(missing_place_ids) == 0\n\
          \    )\n\n    return {\n        \"selected_places_json\": json.dumps(\n\
          \            selected_places,\n            ensure_ascii=False\n        ),\n\
          \        \"selected_place_names\": selected_place_names,\n        \"selected_place_areas\"\
          : selected_place_areas,\n        \"preferred_hotel_areas\": preferred_hotel_areas,\n\
          \        \"missing_place_ids\": missing_place_ids,\n        \"selected_place_count\"\
          : len(selected_places),\n        \"extraction_valid\": extraction_valid,\n\
          \    }"
