    - data:
        code: "import json\n\n\ndef main(\n    hotel_search_summary: str,\n    applied_filters_json:\
          \ str,\n) -> dict:\n\n    # ----------------------------------------\n \
          \   # Helpers\n    # ----------------------------------------\n\n    def\
          \ parse_object(value):\n        if not isinstance(value, str):\n       \
          \     return {}\n\n        try:\n            data = json.loads(value)\n\
          \        except Exception:\n            return {}\n\n        return data\
          \ if isinstance(data, dict) else {}\n\n    def add_suggestion(\n       \
          \ suggestions,\n        field,\n        label,\n        content,\n    ):\n\
          \        suggestions.append({\n            \"field\": field,\n         \
          \   \"label\": label,\n            \"content\": content,\n        })\n\n\
          \    # ----------------------------------------\n    # 1. Parse applied\
          \ query\n    # ----------------------------------------\n\n    applied_query\
          \ = parse_object(\n        applied_filters_json\n    )\n\n    # Hotel API\
          \ currently keeps the complete query\n    # inside applied_filters for compatibility.\n\
          \    # Only these fields are true hard constraints.\n\n    hard_filter_keys\
          \ = [\n        \"budget\",\n        \"guests\",\n        \"availability_only\"\
          ,\n        \"parking_required\",\n        \"free_cancellation_required\"\
          ,\n        \"areas\",\n        \"sub_areas\",\n    ]\n\n    active_constraints\
          \ = {}\n\n    for key in hard_filter_keys:\n        if key in applied_query:\n\
          \            active_constraints[key] = (\n                applied_query[key]\n\
          \            )\n\n    # ----------------------------------------\n    #\
          \ 2. Build user-controlled suggestions\n    # ----------------------------------------\n\
          \n    suggestions = []\n\n    budget = active_constraints.get(\n       \
          \ \"budget\"\n    )\n\n    if isinstance(budget, dict):\n        budget_max\
          \ = budget.get(\"max\")\n\n        if isinstance(\n            budget_max,\n\
          \            (int, float)\n        ) and budget_max > 0:\n\n           \
          \ add_suggestion(\n                suggestions,\n                \"budget\"\
          ,\n                \"预算范围\",\n                (\n                    f\"\
          当前每晚预算上限为 \"\n                    f\"{budget_max:g} 元。\"\n             \
          \       \"如预算具有弹性，可以提高上限后重新查询。\"\n                ),\n            )\n\n\
          \    areas = active_constraints.get(\n        \"areas\"\n    )\n\n    if\
          \ isinstance(areas, list) and areas:\n        add_suggestion(\n        \
          \    suggestions,\n            \"areas\",\n            \"住宿区域\",\n     \
          \       (\n                \"当前设置了明确的行政区域限制。\"\n                \"如区域要求并非必须，可以扩大住宿范围后重新查询。\"\
          \n            ),\n        )\n\n    sub_areas = active_constraints.get(\n\
          \        \"sub_areas\"\n    )\n\n    if (\n        isinstance(sub_areas,\
          \ list)\n        and sub_areas\n    ):\n        add_suggestion(\n      \
          \      suggestions,\n            \"sub_areas\",\n            \"住宿片区\",\n\
          \            (\n                \"当前设置了明确的住宿片区限制。\"\n                \"\
          如片区要求具有弹性，可以扩大候选片区后重新查询。\"\n            ),\n        )\n\n    if active_constraints.get(\n\
          \        \"parking_required\"\n    ) is True:\n        add_suggestion(\n\
          \            suggestions,\n            \"parking_required\",\n         \
          \   \"停车要求\",\n            (\n                \"当前要求酒店必须提供停车条件。\"\n    \
          \            \"如果停车不是硬性需求，可以放宽该条件后重新查询。\"\n            ),\n        )\n\n\
          \    if active_constraints.get(\n        \"free_cancellation_required\"\n\
          \    ) is True:\n        add_suggestion(\n            suggestions,\n   \
          \         \"free_cancellation_required\",\n            \"取消政策\",\n     \
          \       (\n                \"当前要求免费取消政策。\"\n                \"如果行程已经确定，可以考虑放宽该条件后重新查询。\"\
          \n            ),\n        )\n\n    guests = active_constraints.get(\n  \
          \      \"guests\"\n    )\n\n    if (\n        isinstance(guests, (int, float))\n\
          \        and guests > 2\n    ):\n        add_suggestion(\n            suggestions,\n\
          \            \"guests\",\n            \"入住人数\",\n            (\n       \
          \         \"当前入住人数可能限制可用房型。\"\n                \"可以考虑分房方案或重新确认房型人数配置。\"\n\
          \            ),\n        )\n\n    if not suggestions:\n        add_suggestion(\n\
          \            suggestions,\n            \"general\",\n            \"调整条件\"\
          ,\n            (\n                \"当前条件组合下没有匹配候选。\"\n                \"\
          可以调整预算、明确住宿区域要求或其他硬性条件后重新查询。\"\n            ),\n        )\n\n    # ----------------------------------------\n\
          \    # 3. Build NDJSON semantic events\n    # ----------------------------------------\n\
          \n    summary = (\n        \"当前演示酒店数据中没有满足全部硬性条件的候选方案。\"\n        \"系统不会自动提高预算，也不会擅自删除用户明确提出的硬性要求。\"\
          \n    )\n\n    detail = (\n        hotel_search_summary.strip()\n      \
          \  if isinstance(\n            hotel_search_summary,\n            str\n\
          \        )\n        and hotel_search_summary.strip()\n        else \"当前搜索未返回可用候选酒店。\"\
          \n    )\n\n    events = [\n        {\n            \"type\": \"no_candidate\"\
          ,\n            \"payload\": {\n                \"summary\": summary,\n \
          \               \"detail\": detail,\n                \"active_constraints\"\
          : (\n                    active_constraints\n                ),\n      \
          \          \"suggestions\": suggestions,\n            },\n        },\n \
          \       {\n            \"type\": \"data_notice\",\n            \"payload\"\
          : {\n                \"content\": (\n                    \"当前酒店价格、房态和部分酒店政策属于演示数据，\"\
          \n                    \"实际预订前仍需通过正式预订渠道确认。\"\n                )\n      \
          \      },\n        },\n        {\n            \"type\": \"done\",\n    \
          \        \"payload\": {},\n        },\n    ]\n\n    output = \"\\n\".join(\n\
          \        json.dumps(\n            event,\n            ensure_ascii=False,\n\
          \            separators=(\",\", \":\"),\n        )\n        for event in\
          \ events\n    )\n\n    return {\n        \"output\": output,\n        \"\
          suggestion_count\": len(\n            suggestions\n        ),\n        \"\
          zero_candidate_handled\": True,\n    }"
        code_language: python3
        desc: 当 Hotel API 返回零候选时，根据实际硬筛选条件构造确定性的 NDJSON 协议响应，明确说明当前无满足条件的候选方案，并给出可以由用户主动考虑的条件调整方向，不自动修改预算或其他硬约束。
        outputs:
          output:
            children: null
            type: string
          suggestion_count:
            children: null
            type: number
