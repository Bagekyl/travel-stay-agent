          \    # selected-place-derived areas are SOFT preferences.\n    # Do NOT\
          \ write them into areas / sub_areas.\n\n    if normalized_preferred_areas:\n\
          \        request_body[\"preferred_areas\"] = (\n            normalized_preferred_areas\n\
          \        )\n\n    if normalized_preferred_sub_areas:\n        request_body[\"\
          preferred_sub_areas\"] = (\n            normalized_preferred_sub_areas\n\
          \        )\n\n    if normalized_trip_styles:\n        request_body[\"trip_styles\"\
          ] = (\n            normalized_trip_styles\n        )\n\n    if normalized_tags:\n\
          \        request_body[\"tags\"] = (\n            normalized_tags\n     \
          \   )\n\n    if normalized_target_users:\n        request_body[\"target_users\"\
          ] = (\n            normalized_target_users\n        )\n\n    # --------------------------------------------------\n\
          \    # 5. Human-readable strategy summary\n    # --------------------------------------------------\n\
          \n    summary_parts = [\n        \"仅返回模拟房态可用酒店\",\n        \"候选上限 5 家\"\
          ,\n    ]\n\n    if effective_budget > 0:\n        summary_parts.append(\n\
          \            f\"每晚上限 {effective_budget} 元\"\n        )\n\n    if positive_number(traveler_count):\n\
          \        summary_parts.append(\n            f\"{int(traveler_count)} 位住客\"\
          \n        )\n\n    if normalized_preferred_areas:\n        summary_parts.append(\n\
          \            \"偏好区域=\"\n            + str(normalized_preferred_areas)\n\
          \            + \"（软偏好）\"\n        )\n\n    if normalized_preferred_sub_areas:\n\
          \        summary_parts.append(\n            \"偏好片区=\"\n            + str(normalized_preferred_sub_areas)\n\
          \            + \"（软偏好）\"\n        )\n\n    if normalized_trip_styles:\n\
          \        summary_parts.append(\n            \"旅行类型=\"\n            + str(normalized_trip_styles)\n\
          \        )\n\n    search_strategy_summary = \"；\".join(\n        summary_parts\n\
          \    )\n\n    return {\n        \"hotel_search_body\": json.dumps(\n   \
          \         request_body,\n            ensure_ascii=False\n        ),\n\n\
          \        \"effective_budget_max_per_night\": (\n            effective_budget\n\
          \        ),\n\n        \"budget_source\": budget_source,\n\n        \"normalized_preferred_areas\"\
          : (\n            normalized_preferred_areas\n        ),\n\n        \"normalized_preferred_sub_areas\"\
