        selected: false
        template: "【决策证据包】\r\n\r\n====================\r\n一、标准旅行需求\r\n====================\r\
          \n\r\n{{ trip_request }}\r\n\r\n\r\n====================\r\n二、目标地点选择\r\n\
          ====================\r\n\r\n目标地点选择理由：\r\n\r\n{{ target_selection_reason\
          \ }}\r\n\r\n已选目标地点完整数据：\r\n\r\n{{ selected_places_json }}\r\n\r\n\r\n====================\r\
          \n三、天气上下文\r\n====================\r\n\r\n{{ weather_context }}\r\n\r\n\r\
          \n====================\r\n四、候选酒店筛选结果\r\n====================\r\n\r\n酒店搜索摘要：\r\
          \n\r\n{{ hotel_search_summary }}\r\n\r\nHotel API 实际筛选条件：\r\n\r\n{{ applied_filters_json\
          \ }}\r\n\r\n候选酒店数据：\r\n\r\n{{ candidate_hotels_json }}\r\n\r\n\r\n====================\r\
          \n五、真实路线分析\r\n====================\r\n\r\n路线分析摘要：\r\n\r\n{{ route_analysis_summary\
          \ }}\r\n\r\n各候选酒店路线统计：\r\n\r\n{{ hotel_route_stats_json }}\r\n\r\n\r\n====================\r\
          \n六、数据口径与决策约束\r\n====================\r\n\r\n1. 酒店价格、早餐政策、取消政策和房态属于课程演示\
          \ Mock 数据，只能作为当前项目内部决策依据，不得描述为真实可预订信息。\r\n\r\n2. 酒店的 match_score 和 match_reasons\
          \ 来自 Hotel Mock API，用于表示酒店与当前需求的结构化匹配程度，但不是最终推荐结论。\r\n\r\n3. 路线距离和预计驾车时间来自\
          \ Google Routes API，应作为候选酒店交通便利性的事实依据。\r\n\r\n4. route_rank 仅表示在当前所选目标地点条件下的平均路线表现排名，不代表酒店整体质量排名。\r\
          \n\r\n5. 天气上下文有具体预报数据时可以据此调整推荐和行程；天气不可用时，不得生成具体温度、降雨概率、降水量或风速。\r\n\r\n6.\
          \ 最终推荐必须综合考虑：\r\n   - 用户预算与人数；\r\n   - 用户偏好和旅行类型；\r\n   - 目标地点的重要性；\r\n\
          \   - Hotel API 匹配结果；\r\n   - Routes 路线事实；\r\n   - 天气条件；\r\n   - RAG 住宿决策规则。\r\
          \n\r\n7. 不得创造证据包中不存在的酒店、地点、价格、路线时间、天气数据或酒店政策。\r\n\r\n8. 最终应给出明确的主推荐和备选方案，而不是简单重复候选酒店列表。"
