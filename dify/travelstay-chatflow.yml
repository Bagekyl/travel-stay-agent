    nodes:
    - data:
        desc: 接收用户本轮输入的自然语言旅行需求或补充信息，作为旅行需求参数提取和多轮会话状态更新的原始输入。
        selected: false
        title: 旅行需求输入
        type: start
        variables: []
      height: 132
      id: '1783132674319'
      position:
        x: 0
        y: 46.33333333333337
      positionAbsolute:
        x: 0
        y: 46.33333333333337
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        desc: 解析用户本轮自然语言输入，提取目的地、旅行起止日期、行程时长、人数、住宿预算、偏好和旅行类型等结构化参数。只提取或合理归一化用户本轮提供的信息，缺失字段保持为空，不负责酒店推荐、目标地点选择或行程生成。
        instruction: "请从用户本轮输入中提取旅行需求参数。\n\n当前日期：\n{{#1783165504136.current_date#}}\n\
          \n请基于当前日期解析用户输入中的日期表达。\n\n规则：\n1. 只处理本轮输入，不引用或猜测历史信息。\n2. 用户未提供的信息保持为空，不得编造。\n\
          3. 允许进行直接且可靠的语义归一化，例如：\n   - “我和女朋友” → traveler_count = 2\n   - “一家三口” →\
          \ traveler_count = 3\n   - “两天一晚” → duration_days = 2，nights = 1\n   - “想吃东西、看看海、不想太累”\
          \ → preferences = [\"美食\", \"海边\", \"低强度\"]\n4. 区分每晚预算和住宿总预算，不得混淆。\n5. 不推荐酒店，不选择目标地点，不规划行程。\n\
          6. 不确定的信息保持为空。\n\n【日期解析规则】\n\n1. 所有明确或可可靠推断的日期统一输出为 YYYY-MM-DD。\n\n2. 用户只提供月、日但未提供年份时，不要直接视为缺失。\n\
          结合当前日期，推断最近的合理未来日期。\n\n例如：\n当前日期为 2026-07-06，\n用户说“7 月 10 日到 12 日”，\n应输出：\n\
          new_trip_start_date = \"2026-07-10\"\nnew_trip_end_date = \"2026-07-12\"\
          \n\n3. 对“7 月 10 日到 12 日”“7/10-7/12”这类范围，\n结束日期未重复月份时，应继承开始日期的月份和年份。\n\n\
          4. 若无年份日期在当前年份已经过去，则推断为下一自然年的该日期。\n\n5. 跨年范围必须保证结束日期不早于开始日期。\n例如当前日期为 2026-12-20，\n\
          “12 月 30 日到 1 月 2 日”\n应解析为：\n2026-12-30 至 2027-01-02。\n\n6. “明天”“后天”“下周五”等相对日期，应基于当前日期解析为具体日期。\n\
          \n7. 只有确实无法可靠推断日期时，日期字段才保持为空。\n\n8. 不要仅仅因为缺少年份而追问用户年份。\n\n9. 用户明确提供完整年份时，严格保留该年份。\n\
          \n10. 用户只说“住两晚”而完全没有日期信息时，不得虚构日期。"
