    - data:
        code: "import json\nimport re\n\n\ndef main(\n    routes_body: str,\n    origin_index_map_json:\
          \ str,\n    destination_index_map_json: str,\n) -> dict:\n    \"\"\"\n \
          \   Parse Google Routes Compute Route Matrix response.\n\n    Reconstruct\
          \ route relations using originIndex and destinationIndex,\n    then calculate\
          \ per-hotel route statistics.\n    \"\"\"\n\n    def empty_result(summary:\
          \ str) -> dict:\n        return {\n            \"route_pairs_json\": \"\
          []\",\n            \"hotel_route_stats_json\": \"[]\",\n            \"successful_route_count\"\
          : 0,\n            \"failed_route_count\": 0,\n            \"hotel_route_count\"\
          : 0,\n            \"route_matrix_valid\": False,\n            \"route_analysis_summary\"\
          : summary,\n        }\n\n    def parse_json(value, expected_type):\n   \
          \     try:\n            data = json.loads(value)\n        except Exception:\n\
          \            return expected_type()\n\n        return data if isinstance(data,\
          \ expected_type) else expected_type()\n\n    def parse_duration_seconds(duration):\n\
          \        \"\"\"\n        Google Duration format examples:\n        1869s\n\
          \        123.45s\n        \"\"\"\n        if not isinstance(duration, str):\n\
          \            return None\n\n        match = re.fullmatch(\n            r\"\
          ([0-9]+(?:\\.[0-9]+)?)s\",\n            duration.strip()\n        )\n\n\
          \        if not match:\n            return None\n\n        return float(match.group(1))\n\
          \n    # -----------------------------\n    # Parse inputs\n    # -----------------------------\n\
          \n    route_elements = parse_json(routes_body, list)\n    origin_map_list\
          \ = parse_json(\n        origin_index_map_json,\n        list\n    )\n \
          \   destination_map_list = parse_json(\n        destination_index_map_json,\n\
          \        list\n    )\n\n    if not route_elements:\n        return empty_result(\n\
          \            \"Google Routes 未返回可解析的路线矩阵元素。\"\n        )\n\n    origin_map\
          \ = {\n        item.get(\"origin_index\"): item\n        for item in origin_map_list\n\
          \        if isinstance(item, dict)\n        and isinstance(item.get(\"origin_index\"\
          ), int)\n    }\n\n    destination_map = {\n        item.get(\"destination_index\"\
          ): item\n        for item in destination_map_list\n        if isinstance(item,\
          \ dict)\n        and isinstance(\n            item.get(\"destination_index\"\
          ),\n            int\n        )\n    }\n\n    if not origin_map or not destination_map:\n\
          \        return empty_result(\n            \"起点或终点索引映射无效。\"\n        )\n\
          \n    # -----------------------------\n    # Parse matrix elements\n   \
          \ # -----------------------------\n\n    route_pairs = []\n    failed_routes\
          \ = []\n\n    for element in route_elements:\n        if not isinstance(element,\
          \ dict):\n            continue\n\n        origin_index = element.get(\"\
          originIndex\")\n        destination_index = element.get(\n            \"\
          destinationIndex\"\n        )\n\n        origin = origin_map.get(origin_index)\n\
          \        destination = destination_map.get(\n            destination_index\n\
          \        )\n\n        if origin is None or destination is None:\n      \
          \      failed_routes.append({\n                \"origin_index\": origin_index,\n\
          \                \"destination_index\": destination_index,\n           \
          \     \"reason\": \"索引无法映射\",\n            })\n            continue\n\n\
          \        status = element.get(\"status\", {})\n        condition = element.get(\"\
          condition\")\n\n        status_code = 0\n\n        if isinstance(status,\
          \ dict):\n            status_code = status.get(\"code\", 0) or 0\n\n   \
          \     distance_meters = element.get(\n            \"distanceMeters\"\n \
          \       )\n\n        duration_seconds = parse_duration_seconds(\n      \
          \      element.get(\"duration\")\n        )\n\n        route_ok = (\n  \
          \          status_code == 0\n            and condition == \"ROUTE_EXISTS\"\
          \n            and isinstance(\n                distance_meters,\n      \
          \          (int, float)\n            )\n            and duration_seconds\
          \ is not None\n        )\n\n        if not route_ok:\n            failed_routes.append({\n\
          \                \"origin_index\": origin_index,\n                \"destination_index\"\
          : destination_index,\n                \"hotel_id\": origin.get(\"hotel_id\"\
          ),\n                \"hotel_name\": origin.get(\"hotel_name\"),\n      \
          \          \"place_id\": destination.get(\"place_id\"),\n              \
          \  \"place_name\": destination.get(\n                    \"place_name\"\n\
          \                ),\n                \"condition\": condition,\n       \
          \         \"status\": status,\n            })\n            continue\n\n\
          \        distance_km = round(\n            distance_meters / 1000,\n   \
          \         2\n        )\n\n        duration_minutes = round(\n          \
          \  duration_seconds / 60,\n            1\n        )\n\n        route_pairs.append({\n\
          \            \"origin_index\": origin_index,\n            \"destination_index\"\
          : destination_index,\n\n            \"hotel_id\": origin.get(\"hotel_id\"\
          ),\n            \"hotel_name\": origin.get(\"hotel_name\"),\n\n        \
          \    \"place_id\": destination.get(\"place_id\"),\n            \"place_name\"\
          : destination.get(\n                \"place_name\"\n            ),\n   \
          \         \"place_category\": destination.get(\n                \"category\"\
          \n            ),\n            \"place_area\": destination.get(\"area\"),\n\
          \            \"route_priority\": destination.get(\n                \"route_priority\"\
          \n            ),\n\n            \"distance_meters\": distance_meters,\n\
          \            \"distance_km\": distance_km,\n\n            \"duration_seconds\"\
          : round(\n                duration_seconds,\n                1\n       \
          \     ),\n            \"duration_minutes\": duration_minutes,\n\n      \
          \      \"condition\": condition,\n        })\n\n    if not route_pairs:\n\
          \        return empty_result(\n            \"没有成功解析出有效路线。\"\n        )\n\
          \n    # -----------------------------\n    # Group routes by hotel\n   \
          \ # -----------------------------\n\n    hotel_groups = {}\n\n    for route\
          \ in route_pairs:\n        hotel_id = route[\"hotel_id\"]\n\n        if\
          \ hotel_id not in hotel_groups:\n            hotel_groups[hotel_id] = {\n\
          \                \"hotel_id\": hotel_id,\n                \"hotel_name\"\
          : route[\"hotel_name\"],\n                \"routes\": [],\n            }\n\
          \n        hotel_groups[hotel_id][\"routes\"].append(\n            route\n\
          \        )\n\n    hotel_stats = []\n\n    for hotel in hotel_groups.values():\n\
          \        routes = hotel[\"routes\"]\n\n        durations = [\n         \
          \   route[\"duration_minutes\"]\n            for route in routes\n     \
          \   ]\n\n        distances = [\n            route[\"distance_km\"]\n   \
          \         for route in routes\n        ]\n\n        average_duration = round(\n\
          \            sum(durations) / len(durations),\n            1\n        )\n\
          \n        average_distance = round(\n            sum(distances) / len(distances),\n\
          \            2\n        )\n\n        fastest_route = min(\n            routes,\n\
          \            key=lambda x: x[\"duration_minutes\"]\n        )\n\n      \
          \  slowest_route = max(\n            routes,\n            key=lambda x:\
          \ x[\"duration_minutes\"]\n        )\n\n        high_priority_routes = [\n\
          \            route\n            for route in routes\n            if route.get(\"\
          route_priority\") == \"high\"\n        ]\n\n        if high_priority_routes:\n\
          \            high_priority_avg = round(\n                sum(\n        \
          \            route[\"duration_minutes\"]\n                    for route\
          \ in high_priority_routes\n                )\n                / len(high_priority_routes),\n\
          \                1\n            )\n        else:\n            high_priority_avg\
          \ = None\n\n        hotel_stats.append({\n            \"hotel_id\": hotel[\"\
          hotel_id\"],\n            \"hotel_name\": hotel[\"hotel_name\"],\n\n   \
          \         \"route_count\": len(routes),\n\n            \"average_duration_minutes\"\
          : (\n                average_duration\n            ),\n\n            \"\
          average_distance_km\": (\n                average_distance\n           \
          \ ),\n\n            \"high_priority_average_duration_minutes\": (\n    \
          \            high_priority_avg\n            ),\n\n            \"fastest_route\"\
          : {\n                \"place_id\": fastest_route[\n                    \"\
          place_id\"\n                ],\n                \"place_name\": fastest_route[\n\
          \                    \"place_name\"\n                ],\n              \
          \  \"distance_km\": fastest_route[\n                    \"distance_km\"\n\
          \                ],\n                \"duration_minutes\": fastest_route[\n\
          \                    \"duration_minutes\"\n                ],\n        \
          \    },\n\n            \"slowest_route\": {\n                \"place_id\"\
          : slowest_route[\n                    \"place_id\"\n                ],\n\
          \                \"place_name\": slowest_route[\n                    \"\
          place_name\"\n                ],\n                \"distance_km\": slowest_route[\n\
          \                    \"distance_km\"\n                ],\n             \
          \   \"duration_minutes\": slowest_route[\n                    \"duration_minutes\"\
          \n                ],\n            },\n\n            \"routes\": [\n    \
          \            {\n                    \"place_id\": route[\"place_id\"],\n\
          \                    \"place_name\": route[\n                        \"\
          place_name\"\n                    ],\n                    \"route_priority\"\
          : route[\n                        \"route_priority\"\n                 \
          \   ],\n                    \"distance_km\": route[\n                  \
          \      \"distance_km\"\n                    ],\n                    \"duration_minutes\"\
          : route[\n                        \"duration_minutes\"\n               \
          \     ],\n                }\n                for route in routes\n     \
          \       ],\n        })\n\n    # -----------------------------\n    # Rank\
          \ hotels by average duration\n    # -----------------------------\n\n  \
          \  hotel_stats.sort(\n        key=lambda x: x[\n            \"average_duration_minutes\"\
          \n        ]\n    )\n\n    for rank, hotel in enumerate(\n        hotel_stats,\n\
          \        start=1\n    ):\n        hotel[\"route_rank\"] = rank\n\n    #\
          \ -----------------------------\n    # Summary\n    # -----------------------------\n\
          \n    best_hotel = hotel_stats[0]\n\n    summary = (\n        f\"成功解析 {len(route_pairs)}\
          \ 条路线，\"\n        f\"失败 {len(failed_routes)} 条；\"\n        f\"共形成 {len(hotel_stats)}\
          \ 家酒店的路线统计。\"\n        f\"按平均驾车时间排序，\"\n        f\"当前路线表现最佳的是\"\n      \
          \  f\"{best_hotel['hotel_name']}，\"\n        f\"平均约 \"\n        f\"{best_hotel['average_duration_minutes']}\
          \ 分钟。\"\n    )\n\n    return {\n        \"route_pairs_json\": json.dumps(\n\
          \            route_pairs,\n            ensure_ascii=False\n        ),\n\n\
          \        \"hotel_route_stats_json\": json.dumps(\n            hotel_stats,\n\
          \            ensure_ascii=False\n        ),\n\n        \"successful_route_count\"\
          : len(\n            route_pairs\n        ),\n\n        \"failed_route_count\"\
          : len(\n            failed_routes\n        ),\n\n        \"hotel_route_count\"\
          : len(\n            hotel_stats\n        ),\n\n        \"route_matrix_valid\"\
          : True,\n\n        \"route_analysis_summary\": summary,\n    }"
        code_language: python3
