    - data:
        code: "import json\n\n\ndef main(hotels_body: str) -> dict:\n    \"\"\"\n\
          \    Parse and normalize the Hotel Mock API response.\n\n    Outputs:\n\
          \    1. Candidate hotel data for downstream reasoning.\n    2. Lightweight\
          \ route origins for Google Routes.\n    3. Validation and debugging information.\n\
          \    \"\"\"\n\n    def empty_result(summary: str) -> dict:\n        return\
          \ {\n            \"candidate_hotels_json\": \"[]\",\n            \"route_origins_json\"\
          : \"[]\",\n            \"candidate_hotel_ids\": [],\n            \"candidate_hotel_names\"\
          : [],\n            \"candidate_hotel_count\": 0,\n            \"total_candidates\"\
          : 0,\n            \"applied_filters_json\": \"{}\",\n            \"route_ready_count\"\
          : 0,\n            \"hotel_search_valid\": False,\n            \"all_hotels_route_ready\"\
          : False,\n            \"hotel_search_summary\": summary,\n        }\n\n\
          \    try:\n        payload = json.loads(hotels_body)\n    except Exception:\n\
          \        return empty_result(\n            \"Hotel API 响应无法解析为合法 JSON。\"\
          \n        )\n\n    if not isinstance(payload, dict):\n        return empty_result(\n\
          \            \"Hotel API 响应结构无效。\"\n        )\n\n    api_ok = payload.get(\"\
          ok\") is True\n    data = payload.get(\"data\", [])\n    applied_filters\
          \ = payload.get(\"applied_filters\", {})\n\n    if not isinstance(data,\
          \ list):\n        data = []\n\n    if not isinstance(applied_filters, dict):\n\
          \        applied_filters = {}\n\n    try:\n        total_candidates = int(\n\
          \            payload.get(\"total_candidates\", 0)\n        )\n    except\
          \ (TypeError, ValueError):\n        total_candidates = 0\n\n    candidate_hotels\
          \ = []\n    route_origins = []\n    candidate_hotel_ids = []\n    candidate_hotel_names\
          \ = []\n\n    for hotel in data:\n        if not isinstance(hotel, dict):\n\
          \            continue\n\n        hotel_id = hotel.get(\"hotel_id\")\n  \
          \      name = hotel.get(\"name\")\n\n        if not hotel_id or not name:\n\
          \            continue\n\n        # Keep the fields needed for final decision\
          \ and explanation.\n        compact_hotel = {\n            \"hotel_id\"\
          : hotel_id,\n            \"name\": name,\n            \"brand\": hotel.get(\"\
          brand\"),\n            \"area\": hotel.get(\"area\"),\n            \"sub_area\"\
          : hotel.get(\"sub_area\"),\n            \"address\": hotel.get(\"address\"\
          ),\n            \"google_place_id\": hotel.get(\"google_place_id\"),\n \
          \           \"location\": hotel.get(\"location\", {}),\n            \"hotel_type\"\
          : hotel.get(\"hotel_type\"),\n            \"star_rating\": hotel.get(\"\
          star_rating\"),\n            \"review\": hotel.get(\"review\", {}),\n  \
          \          \"mock_price_per_night\": hotel.get(\n                \"mock_price_per_night\"\
          \n            ),\n            \"price_range_cny\": hotel.get(\n        \
          \        \"price_range_cny\", {}\n            ),\n            \"room_types\"\
          : hotel.get(\"room_types\", []),\n            \"breakfast\": hotel.get(\"\
          breakfast\", {}),\n            \"cancellation\": hotel.get(\n          \
          \      \"cancellation\", {}\n            ),\n            \"availability\"\
          : hotel.get(\n                \"availability\", {}\n            ),\n   \
          \         \"parking\": hotel.get(\"parking\", {}),\n            \"facilities\"\
          : hotel.get(\"facilities\", []),\n            \"tags\": hotel.get(\"tags\"\
          , []),\n            \"target_users\": hotel.get(\n                \"target_users\"\
          , []\n            ),\n            \"trip_styles\": hotel.get(\n        \
          \        \"trip_styles\", []\n            ),\n            \"summary\": hotel.get(\"\
          summary\", \"\"),\n            \"match_score\": hotel.get(\n           \
          \     \"match_score\", 0\n            ),\n            \"match_reasons\"\
          : hotel.get(\n                \"match_reasons\", []\n            ),\n  \
          \          \"mock_note\": hotel.get(\n                \"mock_note\", \"\"\
          \n            ),\n        }\n\n        candidate_hotels.append(compact_hotel)\n\
          \        candidate_hotel_ids.append(hotel_id)\n        candidate_hotel_names.append(name)\n\
          \n        location = hotel.get(\"location\", {})\n        google_place_id\
          \ = hotel.get(\"google_place_id\")\n\n        latitude = None\n        longitude\
          \ = None\n\n        if isinstance(location, dict):\n            latitude\
          \ = location.get(\"latitude\")\n            longitude = location.get(\"\
          longitude\")\n\n        has_coordinates = (\n            isinstance(latitude,\
          \ (int, float))\n            and isinstance(longitude, (int, float))\n \
          \       )\n\n        has_route_identity = (\n            bool(google_place_id)\n\
          \            or has_coordinates\n        )\n\n        if has_route_identity:\n\
          \            route_origins.append({\n                \"hotel_id\": hotel_id,\n\
          \                \"name\": name,\n                \"google_place_id\": google_place_id,\n\
          \                \"location\": {\n                    \"latitude\": latitude,\n\
          \                    \"longitude\": longitude,\n                },\n   \
          \         })\n\n    candidate_hotel_count = len(candidate_hotels)\n    route_ready_count\
          \ = len(route_origins)\n\n    hotel_search_valid = (\n        api_ok\n \
          \       and candidate_hotel_count > 0\n    )\n\n    all_hotels_route_ready\
          \ = (\n        candidate_hotel_count > 0\n        and route_ready_count\n\
          \        == candidate_hotel_count\n    )\n\n    summary_parts = [\n    \
          \    f\"Hotel API 返回 {candidate_hotel_count} 家候选酒店\",\n        f\"硬过滤后的候选总数为\
          \ {total_candidates}\",\n        f\"其中 {route_ready_count} 家具备路线计算所需的位置标识\"\
          ,\n    ]\n\n    if not api_ok:\n        summary_parts.append(\n        \
          \    \"API ok 状态为 false\"\n        )\n\n    if candidate_hotel_count ==\
          \ 0:\n        summary_parts.append(\n            \"当前筛选条件下没有可用候选酒店\"\n \
          \       )\n\n    return {\n        \"candidate_hotels_json\": json.dumps(\n\
          \            candidate_hotels,\n            ensure_ascii=False\n       \
          \ ),\n        \"route_origins_json\": json.dumps(\n            route_origins,\n\
          \            ensure_ascii=False\n        ),\n        \"candidate_hotel_ids\"\
          : candidate_hotel_ids,\n        \"candidate_hotel_names\": candidate_hotel_names,\n\
          \        \"candidate_hotel_count\": candidate_hotel_count,\n        \"total_candidates\"\
          : total_candidates,\n        \"applied_filters_json\": json.dumps(\n   \
          \         applied_filters,\n            ensure_ascii=False\n        ),\n\
          \        \"route_ready_count\": route_ready_count,\n        \"hotel_search_valid\"\
          : hotel_search_valid,\n        \"all_hotels_route_ready\": (\n         \
          \   all_hotels_route_ready\n        ),\n        \"hotel_search_summary\"\
          : \"；\".join(\n            summary_parts\n        ),\n    }"
        code_language: python3
