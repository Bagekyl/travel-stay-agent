    - data:
        code: "import json\nfrom typing import Any\n\n\ndef main(\n    candidate_hotels_json:\
          \ str,\n    selected_places_json: str,\n    hotel_route_stats_json: str,\n\
          \    route_matrix_valid: bool,\n    weather_context: str,\n) -> dict:\n\n\
          \    # ----------------------------------------\n    # Helpers\n    # ----------------------------------------\n\
          \n    def unwrap_output(value: Any) -> Any:\n        \"\"\"\n        Unwrap\
          \ Variable Aggregator group outputs such as:\n        {\"output\": actual_value}\n\
          \        \"\"\"\n        current = value\n\n        while (\n          \
          \  isinstance(current, dict)\n            and \"output\" in current\n  \
          \          and len(current) == 1\n        ):\n            current = current[\"\
          output\"]\n\n        return current\n\n    def parse_json(\n        value:\
          \ Any,\n        default: Any,\n    ) -> Any:\n        \"\"\"\n        Parse\
          \ JSON strings after unwrapping Variable Aggregator output.\n        Existing\
          \ list or dict values are returned directly.\n        \"\"\"\n        value\
          \ = unwrap_output(value)\n\n        if isinstance(value, (list, dict)):\n\
          \            return value\n\n        if not isinstance(value, str):\n  \
          \          return default\n\n        value = value.strip()\n\n        if\
          \ not value:\n            return default\n\n        try:\n            return\
          \ json.loads(value)\n        except Exception:\n            return default\n\
          \n    def as_list(\n        value: Any,\n    ) -> list:\n        \"\"\"\n\
          \        Normalize parsed values into a list.\n        \"\"\"\n        if\
          \ isinstance(value, list):\n            return value\n\n        if isinstance(value,\
          \ dict):\n            data = value.get(\"data\")\n\n            if isinstance(data,\
          \ list):\n                return data\n\n        return []\n\n    def safe_dict(\n\
          \        value: Any,\n    ) -> dict:\n        return (\n            value\n\
          \            if isinstance(value, dict)\n            else {}\n        )\n\
          \n    def safe_list(\n        value: Any,\n    ) -> list:\n        return\
          \ (\n            value\n            if isinstance(value, list)\n       \
          \     else []\n        )\n\n    def normalize_boolean(\n        value: Any,\n\
          \    ) -> bool:\n        \"\"\"\n        Normalize Boolean values after\
          \ Variable Aggregator unwrapping.\n        \"\"\"\n        value = unwrap_output(value)\n\
          \n        if isinstance(value, bool):\n            return value\n\n    \
          \    if isinstance(value, str):\n            normalized = value.strip().lower()\n\
          \n            if normalized == \"true\":\n                return True\n\n\
          \            if normalized == \"false\":\n                return False\n\
          \n        if isinstance(value, (int, float)):\n            return value\
          \ != 0\n\n        return False\n\n    def detect_weather_mode(\n       \
          \ context: str,\n    ) -> str:\n        \"\"\"\n        Detect normalized\
          \ weather coverage mode from\n        aggregated weather context.\n    \
          \    \"\"\"\n        if not isinstance(context, str):\n            return\
          \ \"unavailable\"\n\n        for line in context.splitlines():\n       \
          \     normalized_line = line.strip()\n\n            if normalized_line.startswith(\n\
          \                \"天气覆盖模式：\"\n            ):\n                mode = normalized_line.split(\n\
          \                    \"：\",\n                    1,\n                )[1].strip().lower()\n\
          \n                if mode in {\n                    \"full\",\n        \
          \            \"partial\",\n                    \"unavailable\",\n      \
          \          }:\n                    return mode\n\n            if normalized_line.startswith(\n\
          \                \"天气覆盖模式:\"\n            ):\n                mode = normalized_line.split(\n\
          \                    \":\",\n                    1,\n                )[1].strip().lower()\n\
          \n                if mode in {\n                    \"full\",\n        \
          \            \"partial\",\n                    \"unavailable\",\n      \
          \          }:\n                    return mode\n\n        # Unknown or malformed\
          \ context must not be\n        # treated as confirmed weather data.\n  \
          \      return \"unavailable\"\n\n    # ----------------------------------------\n\
          \    # 1. Parse upstream facts\n    # ----------------------------------------\n\
          \n    raw_hotels = as_list(\n        parse_json(\n            candidate_hotels_json,\n\
          \            [],\n        )\n    )\n\n    raw_places = as_list(\n      \
          \  parse_json(\n            selected_places_json,\n            [],\n   \
          \     )\n    )\n\n    raw_route_stats = as_list(\n        parse_json(\n\
          \            hotel_route_stats_json,\n            [],\n        )\n    )\n\
          \n    normalized_route_matrix_valid = (\n        normalize_boolean(\n  \
          \          route_matrix_valid\n        )\n    )\n\n    # ----------------------------------------\n\
          \    # 2. Normalize hotel fact cards\n    # ----------------------------------------\n\
          \n    hotels = []\n\n    for raw_hotel in raw_hotels:\n        if not isinstance(raw_hotel,\
          \ dict):\n            continue\n\n        breakfast = safe_dict(\n     \
          \       raw_hotel.get(\"breakfast\")\n        )\n\n        cancellation\
          \ = safe_dict(\n            raw_hotel.get(\"cancellation\")\n        )\n\
          \n        availability = safe_dict(\n            raw_hotel.get(\"availability\"\
          )\n        )\n\n        parking = safe_dict(\n            raw_hotel.get(\"\
          parking\")\n        )\n\n        review = safe_dict(\n            raw_hotel.get(\"\
          review\")\n        )\n\n        hotel = {\n            \"hotel_id\": raw_hotel.get(\n\
          \                \"hotel_id\"\n            ),\n            \"name\": raw_hotel.get(\n\
          \                \"name\"\n            ),\n            \"brand\": raw_hotel.get(\n\
          \                \"brand\"\n            ),\n            \"area\": raw_hotel.get(\n\
          \                \"area\"\n            ),\n            \"sub_area\": raw_hotel.get(\n\
          \                \"sub_area\"\n            ),\n            \"address\":\
          \ raw_hotel.get(\n                \"address\"\n            ),\n        \
          \    \"hotel_type\": raw_hotel.get(\n                \"hotel_type\"\n  \
          \          ),\n            \"star_rating\": raw_hotel.get(\n           \
          \     \"star_rating\"\n            ),\n            \"price\": {\n      \
          \          \"amount_cny\": raw_hotel.get(\n                    \"mock_price_per_night\"\
          \n                ),\n                \"currency\": raw_hotel.get(\n   \
          \                 \"currency\",\n                    \"CNY\",\n        \
          \        ),\n                \"basis\": \"per_night\",\n               \
          \ \"data_mode\": \"mock_demo\",\n            },\n            \"breakfast\"\
          : {\n                \"included\": breakfast.get(\n                    \"\
          included\"\n                ),\n                \"price_cny\": breakfast.get(\n\
          \                    \"price_cny\"\n                ),\n               \
          \ \"type\": breakfast.get(\n                    \"type\"\n             \
          \   ),\n            },\n            \"parking\": {\n                \"available\"\
          : parking.get(\n                    \"available\"\n                ),\n\
          \                \"fee_note\": parking.get(\n                    \"fee_note\"\
          \n                ),\n            },\n            \"cancellation\": {\n\
          \                \"free_cancellation\": (\n                    cancellation.get(\n\
          \                        \"free_cancellation\"\n                    )\n\
          \                ),\n                \"deadline_note\": (\n            \
          \        cancellation.get(\n                        \"deadline_note\"\n\
          \                    )\n                ),\n            },\n           \
          \ \"availability\": {\n                \"available\": availability.get(\n\
          \                    \"available\"\n                ),\n               \
          \ \"status_note\": availability.get(\n                    \"status_note\"\
          \n                ),\n            },\n            \"facilities\": safe_list(\n\
          \                raw_hotel.get(\"facilities\")\n            ),\n       \
          \     \"tags\": safe_list(\n                raw_hotel.get(\"tags\")\n  \
          \          ),\n            \"trip_styles\": safe_list(\n               \
          \ raw_hotel.get(\"trip_styles\")\n            ),\n            \"review\"\
          : {\n                \"score\": review.get(\n                    \"score\"\
          \n                ),\n                \"count\": review.get(\n         \
          \           \"count\"\n                ),\n                \"source_note\"\
          : review.get(\n                    \"source_note\"\n                ),\n\
          \            },\n            \"match_score\": raw_hotel.get(\n         \
          \       \"match_score\"\n            ),\n            \"match_reasons\":\
          \ safe_list(\n                raw_hotel.get(\n                    \"match_reasons\"\
          \n                )\n            ),\n        }\n\n        hotels.append(hotel)\n\
          \n    # ----------------------------------------\n    # 3. Normalize selected\
          \ place facts\n    # ----------------------------------------\n\n    target_places\
          \ = []\n\n    for raw_place in raw_places:\n        if not isinstance(raw_place,\
          \ dict):\n            continue\n\n        place = {\n            \"place_id\"\
          : raw_place.get(\n                \"place_id\"\n            ),\n       \
          \     \"name\": raw_place.get(\n                \"name\"\n            ),\n\
          \            \"category\": raw_place.get(\n                \"category\"\n\
          \            ),\n            \"area\": raw_place.get(\n                \"\
          area\"\n            ),\n            \"sub_area\": raw_place.get(\n     \
          \           \"sub_area\"\n            ),\n            \"address\": raw_place.get(\n\
          \                \"address\"\n            ),\n            \"priority\":\
          \ raw_place.get(\n                \"priority\"\n            ),\n       \
          \ }\n\n        # Remove fields that are entirely absent\n        place =\
          \ {\n            key: value\n            for key, value in place.items()\n\
          \            if value is not None\n        }\n\n        target_places.append(place)\n\
          \n    # ----------------------------------------\n    # 4. Weather context\n\
          \    # ----------------------------------------\n\n    raw_weather_context\
          \ = unwrap_output(\n        weather_context\n    )\n\n    normalized_weather_context\
          \ = (\n        raw_weather_context.strip()\n        if isinstance(\n   \
          \         raw_weather_context,\n            str,\n        )\n        else\
          \ \"\"\n    )\n\n    weather_mode = detect_weather_mode(\n        normalized_weather_context\n\
          \    )\n\n    weather_available = (\n        weather_mode in {\n       \
          \     \"full\",\n            \"partial\",\n        }\n    )\n\n    weather\
          \ = {\n        \"available\": weather_available,\n        \"coverage_mode\"\
          : weather_mode,\n        \"context\": (\n            normalized_weather_context\n\
          \        ),\n        \"source\": (\n            \"open_meteo\"\n       \
          \     if weather_available\n            else \"degraded_context\"\n    \
          \    ),\n    }\n\n    # ----------------------------------------\n    #\
          \ 5. Build deterministic fact frame\n    # ----------------------------------------\n\
          \n    payload = {\n        \"schema_version\": \"1.0\",\n        \"scope\"\
          : \"normal_recommendation\",\n        \"hotel_data_mode\": \"mock_demo\"\
          ,\n        \"route_data_mode\": (\n            \"google_routes\"\n     \
          \       if normalized_route_matrix_valid\n            else \"unavailable\"\
          \n        ),\n        \"candidate_count\": len(\n            hotels\n  \
          \      ),\n        \"selected_place_count\": len(\n            target_places\n\
          \        ),\n        \"hotels\": hotels,\n        \"target_places\": target_places,\n\
          \        \"route_matrix\": {\n            \"valid\": (\n               \
          \ normalized_route_matrix_valid\n            ),\n            \"hotel_route_stats\"\
          : (\n                raw_route_stats\n            ),\n        },\n     \
          \   \"weather\": weather,\n    }\n\n    event = {\n        \"type\": \"\
          fact_frame\",\n        \"payload\": payload,\n    }\n\n    # Compact NDJSON\
          \ physical line\n    output = json.dumps(\n        event,\n        ensure_ascii=False,\n\
          \        separators=(\",\", \":\"),\n    )\n\n    fact_frame_json = json.dumps(\n\
          \        payload,\n        ensure_ascii=False,\n        separators=(\",\"\
          , \":\"),\n    )\n\n    return {\n        \"output\": output,\n        \"\
          fact_frame_json\": (\n            fact_frame_json\n        ),\n        \"\
          hotel_fact_count\": len(\n            hotels\n        ),\n        \"route_fact_count\"\
          : len(\n            raw_route_stats\n        ),\n        \"fact_frame_valid\"\
          : (\n            len(hotels) > 0\n        ),\n    }"
        code_language: python3
