          \n    current_date = now.date()\n    forecast_last_date = current_date +\
          \ timedelta(days=15)\n\n    return {\n        \"current_date\": current_date.isoformat(),\n\
          \        \"current_datetime\": now.isoformat(),\n        \"timezone\": \"\
          Asia/Shanghai\",\n        \"forecast_last_date\": forecast_last_date.isoformat(),\n\
          \    }"
