    - data:
        code: "import json\nimport re\n\n\nAREA_VOCAB = {\n    \"龙华区\",\n    \"美兰区\"\
          ,\n    \"秀英区\",\n    \"琼山区\",\n}\n\n\nTRIP_STYLE_ALIASES = {\n    \"商务\"\
          : \"商务出差\",\n    \"商务旅行\": \"商务出差\",\n    \"商务出差\": \"商务出差\",\n\n    \"\
          亲子\": \"亲子旅行\",\n    \"亲子游\": \"亲子旅行\",\n    \"亲子旅行\": \"亲子旅行\",\n\n   \
          \ \"度假\": \"纯度假\",\n    \"休闲度假\": \"纯度假\",\n    \"纯度假\": \"纯度假\",\n\n  \
          \  \"访校\": \"访校/考试\",\n    \"考试\": \"访校/考试\",\n    \"访校/考试\": \"访校/考试\"\
          ,\n\n    \"自驾\": \"自驾\",\n    \"短途旅行\": \"短途旅行\",\n    \"城市漫游\": \"城市漫游\"\
          ,\n    \"中转\": \"中转\",\n    \"环岛铁路旅行\": \"环岛铁路旅行\",\n}\n\n\nPREFERENCE_MAP\
          \ = {\n    \"美食\": {\n        \"tags\": [\"美食方便\"],\n    },\n\n    \"海边\"\
          : {\n        \"tags\": [\"近海边\"],\n    },\n\n    \"亲子\": {\n        \"tags\"\
          : [\"适合亲子\"],\n        \"target_users\": [\"亲子家庭\"],\n        \"trip_styles\"\
          : [\"亲子旅行\"],\n    },\n\n    \"商务\": {\n        \"tags\": [\"商务友好\"],\n\
          \        \"target_users\": [\"商务旅客\"],\n        \"trip_styles\": [\"商务出差\"\
          ],\n    },\n\n    \"度假\": {\n        \"tags\": [\"适合纯度假\"],\n        \"\
          target_users\": [\"度假旅客\"],\n        \"trip_styles\": [\"纯度假\"],\n    },\n\
          \n    \"访校\": {\n        \"target_users\": [\"访校旅客\"],\n        \"trip_styles\"\
          : [\"访校/考试\"],\n    },\n}\n\n\ndef main(\n    budget_max_per_night,\n  \
          \  budget_total,\n    nights,\n    traveler_count,\n    preferences,\n \
          \   trip_style,\n    selected_places_json,\n) -> dict:\n\n    # --------------------------------------------------\n\
          \    # Helpers\n    # --------------------------------------------------\n\
          \n    def positive_number(value):\n        return (\n            isinstance(value,\
          \ (int, float))\n            and not isinstance(value, bool)\n         \
          \   and value > 0\n        )\n\n    def unique_strings(values):\n      \
          \  result = []\n        seen = set()\n\n        for value in values:\n \
          \           if not isinstance(value, str):\n                continue\n\n\
          \            value = value.strip()\n\n            if not value or value\
          \ in seen:\n                continue\n\n            seen.add(value)\n  \
          \          result.append(value)\n\n        return result\n\n    def parse_json_list(value):\n\
          \        if isinstance(value, list):\n            return value\n\n     \
          \   if not isinstance(value, str):\n            return []\n\n        try:\n\
          \            data = json.loads(value)\n        except Exception:\n     \
          \       return []\n\n        return data if isinstance(data, list) else\
          \ []\n\n    def split_trip_styles(value):\n        if not isinstance(value,\
          \ str):\n            return []\n\n        # 不按 \"/\" 切割，因为“访校/考试”本身是合法标准值\n\
          \        parts = re.split(\n            r\"[,，、;；|]+\",\n            value\n\
          \        )\n\n        result = []\n\n        for part in parts:\n      \
          \      part = part.strip()\n\n            if not part:\n               \
          \ continue\n\n            result.append(\n                TRIP_STYLE_ALIASES.get(part,\
          \ part)\n            )\n\n        return unique_strings(result)\n\n    #\
          \ --------------------------------------------------\n    # 1. Budget normalization\n\
          \    # --------------------------------------------------\n\n    effective_budget\
          \ = 0\n    budget_source = \"unknown\"\n\n    if positive_number(budget_max_per_night):\n\
          \        effective_budget = float(\n            budget_max_per_night\n \
          \       )\n        budget_source = \"per_night\"\n\n    elif (\n       \
          \ positive_number(budget_total)\n        and positive_number(nights)\n \
          \   ):\n        effective_budget = round(\n            float(budget_total)\
          \ / float(nights),\n            2\n        )\n        budget_source = \"\
          total_divided_by_nights\"\n\n    # --------------------------------------------------\n\
          \    # 2. Preference normalization\n    # --------------------------------------------------\n\
          \n    raw_preferences = (\n        preferences\n        if isinstance(preferences,\
          \ list)\n        else []\n    )\n\n    normalized_trip_styles = split_trip_styles(\n\
          \        trip_style\n    )\n\n    normalized_tags = []\n    normalized_target_users\
          \ = []\n    unmapped_preferences = []\n\n    for preference in raw_preferences:\n\
          \        if not isinstance(preference, str):\n            continue\n\n \
          \       preference = preference.strip()\n\n        if not preference:\n\
          \            continue\n\n        mapping = PREFERENCE_MAP.get(preference)\n\
          \n        if mapping is None:\n            unmapped_preferences.append(preference)\n\
          \            continue\n\n        normalized_trip_styles.extend(\n      \
          \      mapping.get(\"trip_styles\", [])\n        )\n\n        normalized_tags.extend(\n\
          \            mapping.get(\"tags\", [])\n        )\n\n        normalized_target_users.extend(\n\
          \            mapping.get(\"target_users\", [])\n        )\n\n    normalized_trip_styles\
          \ = unique_strings(\n        normalized_trip_styles\n    )\n\n    normalized_tags\
          \ = unique_strings(\n        normalized_tags\n    )\n\n    normalized_target_users\
          \ = unique_strings(\n        normalized_target_users\n    )\n\n    unmapped_preferences\
          \ = unique_strings(\n        unmapped_preferences\n    )\n\n    # --------------------------------------------------\n\
          \    # 3. Extract soft hotel-area preferences\n    # --------------------------------------------------\n\
          \n    selected_places = parse_json_list(\n        selected_places_json\n\
          \    )\n\n    preferred_area_values = []\n\n    for place in selected_places:\n\
          \        if not isinstance(place, dict):\n            continue\n\n     \
          \   place_preferences = place.get(\n            \"preferred_hotel_areas\"\
          ,\n            []\n        )\n\n        if not isinstance(\n           \
          \ place_preferences,\n            list\n        ):\n            continue\n\
          \n        preferred_area_values.extend(\n            place_preferences\n\
          \        )\n\n    preferred_area_values = unique_strings(\n        preferred_area_values\n\
          \    )\n\n    normalized_preferred_areas = []\n    normalized_preferred_sub_areas\
          \ = []\n\n    for area_value in preferred_area_values:\n        if area_value\
          \ in AREA_VOCAB:\n            normalized_preferred_areas.append(\n     \
          \           area_value\n            )\n        else:\n            normalized_preferred_sub_areas.append(\n\
          \                area_value\n            )\n\n    normalized_preferred_areas\
          \ = unique_strings(\n        normalized_preferred_areas\n    )\n\n    normalized_preferred_sub_areas\
          \ = unique_strings(\n        normalized_preferred_sub_areas\n    )\n\n \
          \   # --------------------------------------------------\n    # 4. Construct\
          \ Hotel API request body\n    # --------------------------------------------------\n\
          \n    request_body = {\n        \"availability_only\": True,\n        \"\
          limit\": 5,\n    }\n\n    if effective_budget > 0:\n        request_body[\"\
          budget\"] = {\n            \"min\": 0,\n            \"max\": effective_budget,\n\
          \        }\n\n    if positive_number(traveler_count):\n        request_body[\"\
